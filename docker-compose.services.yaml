services:
  db:
    build:
      context: ./third-party
    image: MLRERAG/postgresql:pg_vector
    container_name: postgres-MLRERAG
    environment:
      POSTGRES_PASSWORD: LxJd5ouMt%|HVGXL
      POSTGRES_DB: MLRERAG
    ports:
      - 5433:5432
    networks:
      - MLRERAG_network
    volumes:
      - postgres_data:/var/lib/postgresql
    
  redis:
    image: redis:8.4.0-alpine
    container_name: redis-MLRERAG
    ports:
      - 6379:6379
    networks:
      - MLRERAG_network
    volumes:
      - redis_data:/data
  
  grobid:
    image: grobid/grobid:0.8.2.1-crf
    container_name: grobid-MLRERAG
    ports:
      - 8070:8070
    networks:
      - MLRERAG_network
  
  ollama:
    image: ollama/ollama
    container_name: ollama-MLRERAG
    ports:
      - 11435:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ollama_volume:/root/.ollama
  
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-MLRERAG
    ports:
      - 6333:6333
    networks:
      - MLRERAG_network
    volumes:
      - qdrant_data:/qdrant/storage
  
  neo4j:
    image: neo4j:trixie
    container_name: neo4j-MLRERAG
    ports:
      - 7474:7474
      - 7687:7687
    environment:
      - NEO4J_AUTH=neo4j/Xzu6[7tg.o9Y697u
    networks:
      - MLRERAG_network
    volumes:
      - neo4j_data:/neo4j/data:/data
      - neo4j_plugins:/neo4j/plugins:/plugins

volumes:
  postgres_data:
  redis_data:
  ollama_volume:
  neo4j_data:
  neo4j_plugins:
  qdrant_data:

networks:
  MLRERAG_network:
    driver: bridge
    